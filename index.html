<!DOCTYPE html>

<html>

	<head>
	
		<title>Cactus Labs Home</title>
		
		<meta http-equiv="content-type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="initial-scale=1, user-scalable=no, maximum-scale=1, width=device-width, height=device-height">
	
		<link rel="manifest" href="ripples3.json" crossorigin="use-credentials"/>

		<meta name="description" content="ripples3">
		<meta name="theme-color" content="#000000"/>

		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-title" content="ripples3">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">

		<link rel="icon" href="favicon.ico" />
		<link rel="shortcut icon" type="image/png" href="icon.png"/>
		<link rel="apple-touch-icon" sizes="192x192" href="apple-touch-icon.png">

		<link rel="stylesheet" href="css/ripples3.package.min.css">
		<style>
			#cactus-tools {
				position: fixed;
				top: auto;
				right: auto;
				bottom: max(12px, env(safe-area-inset-bottom));
				left: max(12px, env(safe-area-inset-left));
				z-index: 10;
				display: flex;
				align-items: center;
				box-sizing: border-box;
				min-height: 44px;
				padding: 0 14px;
				border: 1px solid currentColor;
				border-radius: var(--rad);
				color: var(--col);
				background: var(--blck);
				font-size: 16px;
				text-decoration: none;
			}
			#cactus-tools:hover { text-decoration: underline; }
			#cactus-tools:focus-visible { outline: 2px solid var(--hil); outline-offset: 4px; }
		</style>
		
		<script src="js/ripples3.package.release.min.js"></script>
		
	</head>

	<body>

		<a href="https://github.com/nicopowa/ripples3"><div id="github"></div></a>
		<a id="cactus-tools" href="https://tools.cactuslabs.co/image/compress/">Image compressor</a>
		<div id="fps"></div>

	</body>

</html>
